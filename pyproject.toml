[project]
name = "ultralearn"
version = "0.2.0"
description = "A local-first personal teacher: active recall, spaced repetition, and a demanding examiner."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.34",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.40",
    "pypdf>=5.0",
    "sse-starlette>=2.1",
    "uvicorn>=0.30",
]

[project.scripts]
ultralearn = "ultralearn.desktop:main"
ultralearn-api = "ultralearn.desktop:serve"

[project.optional-dependencies]
# The native desktop window. Pure Python, uses the system WebKit on macOS.
desktop = ["pywebview>=5.0"]
# True semantic embeddings for Focus search. Pulls in torch (~2GB on disk);
# without it a dependency-free keyword-vector fallback is used automatically.
semantic = ["sentence-transformers>=3.0"]
# EPUB ingestion.
epub = ["EbookLib>=0.18"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ultralearn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
